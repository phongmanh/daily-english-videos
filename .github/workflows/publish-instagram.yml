name: Publish Instagram

# Instagram's API can't schedule posts. The daily run (02:37) uploads the Reel and saves it in
# state/pending_instagram.json; this run publishes it in the evening.
on:
  schedule:
    - cron: "47 10 * * *"   # 10:47 UTC = 17:47 Vietnam time (GitHub may start it a little late)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-video        # never overlaps with the daily run
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Publish the waiting Reel
        id: ig
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python scripts/instagram.py publish

      - name: Save state
        if: ${{ always() }}
        run: |
          git config user.name "daily-english-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Instagram published: ${{ steps.ig.outputs.label || 'cleanup' }}"
          git pull --rebase --quiet && git push
