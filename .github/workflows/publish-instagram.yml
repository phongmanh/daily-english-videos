name: Publish Instagram

# Instagram's API can't schedule posts. The night runs upload the Reels and save them in
# state/pending_instagram.json; these runs publish whatever is due (12:00 review, 18:00 post).
on:
  schedule:
    - cron: "47 4 * * *"    # 04:47 UTC = 11:47 Vietnam time (12:00 review)
    - cron: "47 10 * * *"   # 10:47 UTC = 17:47 Vietnam time (18:00 post)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-video        # never overlaps with the daily run
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Publish the waiting Reels that are due
        id: ig
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python scripts/instagram.py publish

      - name: Save state
        if: ${{ always() }}
        run: |
          git config user.name "daily-english-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Instagram published: ${{ steps.ig.outputs.label || 'cleanup' }}"
          git pull --rebase --quiet && git push
