<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily English – TikTok login</title>
<style>
  body { margin: 0; background: #f4ecde; color: #22202c; font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 40px 20px; }
  .tag { display: inline-block; background: #22202c; color: #fffcf5; font-weight: 700; padding: 6px 16px; border-radius: 999px; font-size: 14px; letter-spacing: .04em; }
  h1 { font-family: Georgia, serif; font-size: 34px; margin: 16px 0 8px; }
  .card { background: #fffcf5; border: 3px solid #22202c; border-radius: 18px; box-shadow: 6px 6px 0 #22202c; padding: 18px 20px; margin: 22px 0; }
  .muted { color: #605c6c; font-size: 14px; }
  pre { white-space: pre-wrap; font: 15px/1.5 system-ui, sans-serif; margin: 10px 0; }
  button { font: 700 16px system-ui, sans-serif; background: #ba4e2e; color: #fffcf5; border: 3px solid #22202c; border-radius: 12px; padding: 10px 18px; box-shadow: 3px 3px 0 #22202c; }
  code { font-size: 22px; word-break: break-all; }
  a { color: #ba4e2e; }
</style>
</head><body><main>
<span class="tag">DAILY ENGLISH</span>
<h1>TikTok login</h1>
<div class="card" id="box">Reading the code…</div>
<p class="muted">Paste this code into <b>scripts/get_tiktok_token.py</b> on your computer. It works once and expires in a few minutes. Don't share it.</p>
</main>
<script>
const q = new URLSearchParams(location.search), box = document.getElementById("box");
if (q.get("code")) {
  const code = q.get("code");
  box.innerHTML = "<p><b>Your code:</b></p><code></code><p><button>Copy code</button></p>";
  box.querySelector("code").textContent = code;
  box.querySelector("button").onclick = e => navigator.clipboard.writeText(code).then(() => e.target.textContent = "Copied ✓");
} else {
  box.textContent = "No code here. " + (q.get("error_description") || q.get("error") || "Start again from scripts/get_tiktok_token.py.");
}
</script>
</body></html>
